<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your Dubai Trip — Waylo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f8faf7;color:#103f3a}nav{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;background:#f8faf7;border-bottom:1px solid #e1e9e3;position:sticky;top:0;z-index:5}.logo img{width:150px;height:62px;object-fit:contain}nav a{color:#164d47;text-decoration:none;font-weight:600}.hero{background:#103f3a;color:white;padding:65px 7%}.eyebrow{color:#f5b13b;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}.hero h1{font-size:48px;margin-bottom:15px}.hero p{color:#d6e5df;font-size:17px;max-width:800px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.pill{background:rgba(255,255,255,.1);padding:10px 15px;border-radius:30px}.wrap{max-width:1050px;margin:45px auto;padding:0 25px}.day{background:white;border:1px solid #e1e9e3;border-radius:18px;margin-bottom:22px;padding:28px;box-shadow:0 10px 30px rgba(20,70,60,.06)}.dayhead{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}.day h2{font-size:24px}.dayhead p{color:#65756f;margin-top:6px}.cost{font-weight:800;color:#0d786c;white-space:nowrap}.activity{display:grid;grid-template-columns:100px 1fr auto;gap:15px;padding:16px 0;border-top:1px solid #edf1ee}.time{font-weight:700;color:#0d786c}.activity h3{font-size:16px;margin-bottom:5px}.activity p{color:#65756f;font-size:14px}.price{font-weight:700;color:#164d47}.summary{background:#edf5ef;border-radius:18px;padding:30px;margin-top:30px}.summary h2{margin-bottom:20px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d5e2da}.total{font-size:22px;font-weight:800;padding-top:18px}.actions{text-align:center;margin:35px}.button{display:inline-block;background:#f5a623;color:#143e39;padding:15px 25px;border-radius:10px;text-decoration:none;font-weight:800}@media(max-width:650px){.hero h1{font-size:36px}.activity{grid-template-columns:75px 1fr}.price{grid-column:2}.dayhead{display:block}.cost{display:block;margin-top:8px}}
</style></head><body>
<nav><div class="logo"><img src="waylo-logo.svg" alt="Waylo"></div><a href="planner.html">← Edit trip</a></nav>
<section class="hero"><div class="eyebrow">Your personalized Dubai plan</div><h1 id="title">Your Dubai trip</h1><p id="subtitle"></p><div class="stats" id="stats"></div></section>
<main class="wrap"><div id="days"></div><div class="summary" id="summary"></div><div class="actions"><a class="button" href="planner.html">Plan Another Trip →</a></div></main>
<script>
const q=new URLSearchParams(location.search);
let saved={};
try{saved=JSON.parse(localStorage.getItem('wayloTrip')||'{}')}catch(e){}
const daysRaw=q.get('days') ?? saved.days;
const days=Math.min(7,Math.max(3,Number.parseInt(daysRaw,10)||5));
const budget=Math.max(50000,Number(q.get('budget')??saved.budget??85000));
const group=q.get('group')||saved.group||'Friends';
const interests=String(q.get('interests')??saved.interests??'beaches,adventure,shopping').split(',').filter(Boolean);
const names={beaches:'Beaches',adventure:'Adventure',shopping:'Shopping',food:'Food',nightlife:'Nightlife',culture:'Culture',photography:'Photography',luxury:'Luxury'};
const places={
beaches:[['10:00 AM','JBR Beach','Relax by the coast and enjoy a laid-back beach morning.',500],['5:00 PM','Dubai Marina','Walk the waterfront and enjoy sunset views.',1000]],
adventure:[['2:00 PM','Desert Safari','Enjoy dune bashing, sandboarding and sunset views.',7000],['7:00 PM','Desert Camp Dinner','Enjoy a traditional dinner and evening entertainment.',3700]],
shopping:[['11:00 AM','Dubai Mall','Explore shops and attractions in Downtown Dubai.',3000],['4:00 PM','Mall of the Emirates','Shop and enjoy indoor entertainment.',5000]],
food:[['1:00 PM','Dubai Food Experience','Try a selection of local and international flavours.',2500],['8:00 PM','JBR Dining','Enjoy dinner by the waterfront.',2500]],
nightlife:[['8:00 PM','Dubai Marina Evening','Explore the lively waterfront after sunset.',2500],['10:00 PM','JBR Evening','Enjoy Dubai’s lively evening atmosphere.',3500]],
culture:[['10:00 AM','Al Fahidi Historical District','Explore the historic lanes and traditional architecture of Old Dubai.',500],['3:00 PM','Dubai Creek and Souks','Take an abra ride and explore the traditional markets.',500]],
photography:[['7:00 AM','Dubai Sunrise','Capture the skyline in the early morning light.',500],['6:00 PM','Dubai Marina Sunset','Photograph the waterfront skyline at golden hour.',1000]],
luxury:[['3:00 PM','Burj Khalifa','Visit the observation deck for panoramic city views.',5500],['7:00 PM','Premium Dinner','Enjoy a special evening dining experience.',6000]]
};
const base=[['10:00 AM','Dubai Mall','Explore one of Dubai’s most popular attractions.',0],['1:00 PM','Lunch in Downtown Dubai','Enjoy a casual lunch near the city centre.',1500],['3:00 PM','Burj Khalifa','Visit the observation deck for panoramic views.',5500],['7:00 PM','Dubai Fountain','Enjoy the evening atmosphere around Downtown Dubai.',0]];
const selected=interests.filter(x=>places[x]);
const pool=selected.length?selected.flatMap(x=>places[x]):base;
let used=new Set(),html='';
for(let d=1;d<=days;d++){
 let activities=[];
 if(d===1){activities=base;}
 else{
   for(const item of pool){
     if(!used.has(item[1])){activities.push(item);used.add(item[1]);}
     if(activities.length>=3)break;
   }
   if(activities.length<2){
     for(const item of base){if(!activities.some(a=>a[1]===item[1]))activities.push(item);if(activities.length>=3)break;}
   }
 }
 const dayCost=activities.reduce((sum,a)=>sum+a[3],0);
 const theme=d===1?'Downtown Dubai':(selected.length?names[selected[(d-2)%selected.length]]+' Experience':'Dubai Discovery');
 html+=`<div class="day"><div class="dayhead"><div><h2>Day ${d} — ${theme}</h2><p>Planned around your ${selected.map(x=>names[x]).slice(0,3).join(', ')} preferences.</p></div><span class="cost">₹${dayCost.toLocaleString('en-IN')}</span></div>`;
 activities.forEach(a=>{html+=`<div class="activity"><div class="time">${a[0]}</div><div><h3>${a[1]}</h3><p>${a[2]}</p></div><div class="price">${a[3]?'₹'+a[3].toLocaleString('en-IN'):'Free'}</div></div>`;});
 html+='</div>';
}
document.getElementById('days').innerHTML=html;
const interestText=selected.map(x=>names[x]).join(' • ');
document.getElementById('title').textContent=`${days}-day Dubai trip, planned your way.`;
document.getElementById('subtitle').textContent=`Designed for ${group.toLowerCase()} with interests in ${interestText||'Dubai highlights'}, within a budget of ₹${budget.toLocaleString('en-IN')}.`;
document.getElementById('stats').innerHTML=`<span class="pill">${group}</span><span class="pill">₹${budget.toLocaleString('en-IN')} Budget</span><span class="pill">${interestText||'Dubai Highlights'}</span><span class="pill">${days} Days</span>`;
const accommodation=Math.round(budget*.35),food=Math.round(budget*.18),transport=Math.round(budget*.12),activities=Math.round(budget*.22),misc=budget-accommodation-food-transport-activities;
document.getElementById('summary').innerHTML=`<h2>Estimated Trip Budget</h2><div class="row"><span>Accommodation</span><strong>₹${accommodation.toLocaleString('en-IN')}</strong></div><div class="row"><span>Food</span><strong>₹${food.toLocaleString('en-IN')}</strong></div><div class="row"><span>Activities</span><strong>₹${activities.toLocaleString('en-IN')}</strong></div><div class="row"><span>Transport</span><strong>₹${transport.toLocaleString('en-IN')}</strong></div><div class="row"><span>Miscellaneous</span><strong>₹${misc.toLocaleString('en-IN')}</strong></div><div class="row total"><span>Planned Budget</span><strong>₹${budget.toLocaleString('en-IN')}</strong></div><p style="margin-top:14px;color:#0d786c;font-weight:700">✓ Itinerary adjusted to your selected budget and preferences</p>`;
</script></body></html>
